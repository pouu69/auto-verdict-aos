<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!--
    Google Play feature graphic (1024x500). Spec: docs/superpowers/specs/2026-10-18-ux-revamp-4-settings-cleanup-design.md §6.3
    Render: see docs/assets-guide.md §2 (Pretendard via PANGOCAIRO_BACKEND=fc + a temporary FONTCONFIG_FILE).
    Flat Toss blue background; no gradients, decorations or shadows. No "엔카" text in the image.
  -->

  <!-- Background: av_accent -->
  <rect width="1024" height="500" fill="#3182F6"/>

  <!-- Left: app icon (colors inverted on blue — white tile, blue foreground).
       Foreground paths are a copy of docs/assets/source/app-icon.svg (108 viewport), scaled 72/108. -->
  <g transform="translate(72,96)">
    <rect width="72" height="72" rx="18" fill="#FFFFFF"/>
    <g transform="scale(0.666667)" fill="#3182F6" fill-rule="evenodd">
      <path d="M35,51 L39.6,37.2 Q40.5,34 43.8,34 H64.2 Q67.5,34 68.4,37.2 L73,51 Z M42.5,37.5 H65.5 L69.25,47.5 H38.75 Z"/>
      <path d="M32,50 H76 A6,6 0 0 1 82,56 V64 A6,6 0 0 1 76,70 H32 A6,6 0 0 1 26,64 V56 A6,6 0 0 1 32,50 Z M32.5,55 H35.5 A2.5,2.5 0 0 1 35.5,60 H32.5 A2.5,2.5 0 0 1 32.5,55 Z M72.5,55 H75.5 A2.5,2.5 0 0 1 75.5,60 H72.5 A2.5,2.5 0 0 1 72.5,55 Z M47.56,57.94 L51.50,61.89 L60.94,52.44 A2.2,2.2 0 0 1 64.06,55.56 L51.50,68.11 L44.44,61.06 A2.2,2.2 0 0 1 47.56,57.94 Z"/>
      <path d="M33.5,68 H38.5 A2.5,2.5 0 0 1 41,70.5 V72.5 A2.5,2.5 0 0 1 38.5,75 H33.5 A2.5,2.5 0 0 1 31,72.5 V70.5 A2.5,2.5 0 0 1 33.5,68 Z"/>
      <path d="M69.5,68 H74.5 A2.5,2.5 0 0 1 77,70.5 V72.5 A2.5,2.5 0 0 1 74.5,75 H69.5 A2.5,2.5 0 0 1 67,72.5 V70.5 A2.5,2.5 0 0 1 69.5,68 Z"/>
    </g>
  </g>

  <!-- Left: headline + subline -->
  <g font-family="Pretendard" fill="#FFFFFF">
    <text x="72" y="248" font-size="52" font-weight="700" letter-spacing="-1.5">중고차, 사기 전에</text>
    <text x="72" y="314" font-size="52" font-weight="700" letter-spacing="-1.5">결론부터 확인하세요</text>
    <text x="72" y="370" font-size="24" font-weight="400" fill-opacity="0.85">매물 링크 하나로 12가지 기준 점검</text>
  </g>

  <!-- Right: result card miniature -->
  <g transform="translate(604,96)" font-family="Pretendard">
    <rect width="348" height="308" rx="24" fill="#FFFFFF"/>

    <!-- AvBadge "주의" (warning) + score -->
    <rect x="28" y="28" width="52" height="28" rx="14" fill="#FFF4E5"/>
    <text x="54" y="47.5" text-anchor="middle" font-size="15" font-weight="600" fill="#9A5000">주의</text>
    <text x="90" y="53" font-size="28" font-weight="700" fill="#9A5000" letter-spacing="-0.5">72점</text>

    <!-- Conclusion sentence -->
    <text x="28" y="114" font-size="26" font-weight="700" fill="#191F28" letter-spacing="-0.5">사기 전에 2가지는</text>
    <text x="28" y="150" font-size="26" font-weight="700" fill="#191F28" letter-spacing="-0.5">꼭 확인하세요</text>

    <!-- Divider -->
    <rect x="28" y="184" width="292" height="1" fill="#E5E8EB"/>

    <!-- Issue rows -->
    <circle cx="32" cy="224" r="4" fill="#FE9800"/>
    <text x="46" y="230" font-size="17" font-weight="400" fill="#333D4B">소유자 변경 5회</text>
    <circle cx="32" cy="264" r="4" fill="#FE9800"/>
    <text x="46" y="270" font-size="17" font-weight="400" fill="#333D4B">자차보험 공백 7개월</text>
  </g>
</svg>
